<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5A800" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="200" fill="#0B2B26" />
  <text x="200" y="130" font-family="'Playfair Display', serif" font-size="64" font-weight="300" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6" filter="url(#glow)">bistrô 1994</text>
  <text x="200" y="165" font-family="Inter, sans-serif" font-size="14" fill="#F4EFE6" text-anchor="middle" letter-spacing="4" opacity="0.7">MATUREIA · PB</text>
</svg>
